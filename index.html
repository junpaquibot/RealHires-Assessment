<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- S4: no network calls. Only this folder's own scripts and styles can load. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>HireIntercept</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="bar-row">
    <div class="brand">
      <h1>HireIntercept <span class="muted">· Real Hires prototype</span></h1>
      <small id="source"></small>
    </div>
    <div class="actions">
      <button id="import-btn" title="Import jobs, candidates or events CSV files. The type is detected from the header row.">Import CSV…</button>
      <input id="import-file" type="file" accept=".csv,text/csv" multiple hidden>
      <button id="sample-btn" title="Go back to the embedded sample files">Load sample data</button>
      <button id="reset-btn" title="Clear reviewer decisions, candidate moves and simulated events">Reset decisions</button>
      <a href="explainer.html">Explainer view →</a>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</header>
<main id="main"><p class="muted">Loading…</p></main>
<dialog id="lead-dialog" aria-label="Lead details"></dialog>

<script src="js/rules.js"></script>
<script src="js/csv.js"></script>
<script src="js/sample-data.js"></script>
<script src="js/sources.js"></script>
<script src="js/normalize.js"></script>
<script src="js/dedup.js"></script>
<script src="js/eligibility.js"></script>
<script src="js/matching.js"></script>
<script src="js/scoring.js"></script>
<script src="js/campaign.js"></script>
<script src="js/assignment.js"></script>
<script src="js/followups.js"></script>
<script src="js/metrics.js"></script>
<script src="js/outreach.js"></script>
<script src="js/quality.js"></script>
<script src="js/pipeline.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
